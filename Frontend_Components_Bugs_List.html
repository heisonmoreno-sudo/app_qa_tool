<!--
  FRONTEND_COMPONENTS_BUGS_LIST.HTML
  ARCHIVO LEGACY - NO USAR (usar Frontend_Components_Bugs_List2.html)
  Listado / histórico de bugs con filtros y acciones
-->

<div id="bugsScreenOLD_DEPRECATED" class="hidden" style="padding: 1rem">
    <div class="card" style="margin-top: 0.5rem">
        <div
            class="card-header"
            style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                flex-wrap: wrap;
            "
        >
            <div style="display: flex; align-items: center; gap: 0.5rem">
                <button
                    class="btn btn-secondary btn-sm"
                    onclick="ocultarPanelBugs()"
                >
                    ⬅ Volver
                </button>
                <div style="font-weight: 700; color: #334155">
                    🐛 Historial de Bugs
                </div>
            </div>
            <div style="display: flex; gap: 0.5rem">
                <button
                    class="btn btn-primary"
                    onclick="abrirModalCrearBug('')"
                >
                    Nuevo Bug
                </button>
            </div>
        </div>
        <div class="card-body">
            <!-- Filtros -->
            <div
                style="
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                    gap: 0.75rem;
                    margin-bottom: 0.75rem;
                "
            >
                <input
                    id="bugFiltroBusqueda"
                    class="input-field"
                    placeholder="Buscar por título o descripción"
                    oninput="try{localStorage.setItem('qaPage_bugs','1')}catch(e){};cargarBugs()"
                />
                <select
                    id="bugFiltroEstado"
                    class="input-field"
                    onchange="try{localStorage.setItem('qaPage_bugs','1')}catch(e){};cargarBugs()"
                >
                    <option value="Todos">Estado: Todos</option>
                    <option value="Abierto">Abierto</option>
                    <option value="Cerrado">Cerrado</option>
                </select>
                <select
                    id="bugFiltroSeveridad"
                    class="input-field"
                    onchange="try{localStorage.setItem('qaPage_bugs','1')}catch(e){};cargarBugs()"
                >
                    <option value="Todas">Severidad: Todas</option>
                    <option value="Crítica">Crítica</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
                <select
                    id="bugFiltroConCaso"
                    class="input-field"
                    onchange="try{localStorage.setItem('qaPage_bugs','1')}catch(e){};cargarBugs()"
                >
                    <option value="Todos">Relación: Todos</option>
                    <option value="ConCaso">Con Caso</option>
                    <option value="SinCaso">Sin Caso</option>
                </select>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 90px">ID</th>
                            <th>Título</th>
                            <th>Estado</th>
                            <th>Severidad</th>
                            <th>Casos</th>
                            <th>Link Caso</th>
                            <th>Fecha</th>
                            <th style="width: 220px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBugs"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function mostrarPanelBugs() {
        try {
            // Mostrar panel de Bugs (registro del usuario)
        } catch (e) {}
        const bugsScreen = document.getElementById("bugsScreen");
        const casosScreen = document.getElementById("casosScreen");
        if (casosScreen) casosScreen.classList.add("hidden");
        if (bugsScreen) bugsScreen.classList.remove("hidden");
        try {
            try {
                localStorage.setItem("qaLastScreen", "bugs");
            } catch (e) {}
            cargarBugs();
        } catch (e) {
            console.error("🐛 Error cargarBugs init:", e);
        }
    }

    function ocultarPanelBugs() {
        const bugsScreen = document.getElementById("bugsScreen");
        const casosScreen = document.getElementById("casosScreen");
        if (bugsScreen) bugsScreen.classList.add("hidden");
        if (casosScreen) casosScreen.classList.remove("hidden");
    }

    function cargarBugs() {
        const url =
            typeof recuperarSheetUrl === "function"
                ? recuperarSheetUrl()
                : null;
        if (!url) {
            console.warn("🐛 [Bugs] No hay sheetUrl");
            mostrarToast && mostrarToast("Conecta un Sheet primero", "warning");
            return;
        }
        const filtros = {};
        const busqueda =
            document.getElementById("bugFiltroBusqueda")?.value.trim() || "";
        const estado =
            document.getElementById("bugFiltroEstado")?.value || "Todos";
        const severidad =
            document.getElementById("bugFiltroSeveridad")?.value || "Todas";
        const relacion =
            document.getElementById("bugFiltroConCaso")?.value || "Todos";
        if (busqueda) filtros.busqueda = busqueda;
        if (estado && estado !== "Todos") filtros.estado = estado;
        if (severidad && severidad !== "Todas") filtros.severidad = severidad;
        if (relacion === "ConCaso") filtros.conCaso = true;
        else if (relacion === "SinCaso") filtros.conCaso = false;
        // Listar bugs con filtros: filtros
        if (typeof mostrarSpinner === "function") mostrarSpinner();
        google.script.run
            .withSuccessHandler(function (res) {
                // Respuesta de listarBugs recibida
                if (!res) {
                    console.warn(
                        "🐛 [Bugs] api_listarBugs devolvió null; intento fallback listarBugs"
                    );
                    google.script.run
                        .withSuccessHandler(function (r2) {
                            // Respuesta listarBugs (fallback)
                            if (typeof ocultarSpinner === "function")
                                ocultarSpinner();
                            if (!r2 || !r2.success) {
                                mostrarToast &&
                                    mostrarToast(
                                        "No se pudieron listar bugs (fallback)",
                                        "error"
                                    );
                                window.__ultimoListadoBugs = [];
                                renderizarTablaBugsPaged([]);
                                return;
                            }
                            var _bugs_fb =
                                r2.data && r2.data.bugs ? r2.data.bugs : [];
                            window.__ultimoListadoBugs = _bugs_fb;
                            renderizarTablaBugsPaged(_bugs_fb);
                        })
                        .withFailureHandler(function (e2) {
                            if (typeof ocultarSpinner === "function")
                                ocultarSpinner();
                            console.error(
                                "🐛 [Bugs] Error listarBugs (fallback):",
                                e2
                            );
                            mostrarToast &&
                                mostrarToast("Error listando bugs", "error");
                            window.__ultimoListadoBugs = [];
                            renderizarTablaBugsPaged([]);
                        })
                        .listarBugs(url, filtros);
                    return;
                }
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                if (!res.success) {
                    mostrarToast &&
                        mostrarToast(
                            "No se pudieron listar bugs: " +
                                (res.mensaje || ""),
                            "error"
                        );
                    window.__ultimoListadoBugs = [];
                    renderizarTablaBugsPaged([]);
                    return;
                }
                var _bugs = res.data && res.data.bugs ? res.data.bugs : [];
                window.__ultimoListadoBugs = _bugs;
                renderizarTablaBugsPaged(_bugs);
            })
            .withFailureHandler(function (err) {
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                console.error("🐛 [Bugs] Error listarBugs:", err);
                if (typeof mostrarToast === "function")
                    mostrarToast(
                        "Error listando bugs: " +
                            (err && err.message ? err.message : err),
                        "error"
                    );
            })
            .api_listarBugs(url, filtros);
    }

    // ===================================================================
    // Paginación cliente para Bugs
    // ===================================================================
    function _leerEstadoPaginacionBugs() {
        var page = parseInt(localStorage.getItem("qaPage_bugs")) || 1;
        var pageSize = parseInt(localStorage.getItem("qaPageSize_bugs")) || 20;
        return { page: page, pageSize: pageSize };
    }

    function _guardarEstadoPaginacionBugs(page, pageSize) {
        try {
            localStorage.setItem("qaPage_bugs", String(page));
            localStorage.setItem("qaPageSize_bugs", String(pageSize));
        } catch (e) {}
    }

    function renderizarTablaBugsPaged(bugs) {
        var tbody = document.getElementById("tablaBugs");
        if (!tbody) return;

        var estado = _leerEstadoPaginacionBugs();
        var page = estado.page || 1;
        var pageSize = estado.pageSize || 20;

        var total = Array.isArray(bugs) ? bugs.length : 0;
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;

        var start = (page - 1) * pageSize;
        var end = start + pageSize;
        var slice = Array.isArray(bugs) ? bugs.slice(start, end) : [];

        // Reuse existing renderer
        renderizarTablaBugs(slice);

        // Pagination controls
        var table = tbody.closest("table") || tbody.parentElement;
        if (table) {
            var paginationId = "bugsPagination";
            var existing = document.getElementById(paginationId);
            if (!existing) {
                existing = document.createElement("div");
                existing.id = paginationId;
                existing.style =
                    "display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0.5rem 0;";
                table.parentElement.insertBefore(existing, table);
            }

            var leftHtml =
                '<div style="display:flex;gap:0.5rem;align-items:center">';
            leftHtml +=
                '<button class="btn btn-sm btn-secondary" onclick="(function(){ _paginaAnteriorBugs(); })()">◀️</button>';
            leftHtml +=
                '<span id="bugsPageInfo" style="font-weight:600"> Página ' +
                page +
                " / " +
                totalPages +
                " </span>";
            leftHtml +=
                '<button class="btn btn-sm btn-secondary" onclick="(function(){ _paginaSiguienteBugs(); })()">▶️</button>';
            leftHtml += "</div>";

            var rightHtml =
                '<div style="display:flex;gap:0.5rem;align-items:center">';
            rightHtml +=
                '<label style="font-size:0.85rem;color:#374151">Tamaño:</label>';
            rightHtml +=
                '<select id="bugsPageSizeSelect" class="input-field" style="width:90px">';
            [10, 20, 30].forEach(function (s) {
                rightHtml +=
                    '<option value="' +
                    s +
                    '"' +
                    (s === pageSize ? " selected" : "") +
                    ">" +
                    s +
                    "</option>";
            });
            rightHtml += "</select>";
            rightHtml += "</div>";

            existing.innerHTML = leftHtml + rightHtml;

            var select = document.getElementById("bugsPageSizeSelect");
            if (select) {
                select.onchange = function () {
                    var newSize = parseInt(this.value) || 20;
                    _guardarEstadoPaginacionBugs(1, newSize);
                    renderizarTablaBugsPaged(window.__ultimoListadoBugs || []);
                };
            }
        }

        _guardarEstadoPaginacionBugs(page, pageSize);
    }

    function _paginaAnteriorBugs() {
        var st = _leerEstadoPaginacionBugs();
        var p = Math.max(1, st.page - 1);
        _guardarEstadoPaginacionBugs(p, st.pageSize);
        renderizarTablaBugsPaged(window.__ultimoListadoBugs || []);
    }

    function _paginaSiguienteBugs() {
        var st = _leerEstadoPaginacionBugs();
        var pageSize = st.pageSize || 20;
        var total = Array.isArray(window.__ultimoListadoBugs)
            ? window.__ultimoListadoBugs.length
            : 0;
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        var p = Math.min(totalPages, st.page + 1);
        _guardarEstadoPaginacionBugs(p, pageSize);
        renderizarTablaBugsPaged(window.__ultimoListadoBugs || []);
    }

    function renderizarTablaBugs(bugs) {
        const tbody = document.getElementById("tablaBugs");
        if (!tbody) return;
        if (!bugs || bugs.length === 0) {
            tbody.innerHTML =
                '<tr><td colspan="8" class="table-empty-cell">Sin bugs para mostrar</td></tr>';
            return;
        }

        let html = "";
        bugs.forEach(function (b) {
            const id = b.ID || "";
            const titulo = b.Titulo || "";
            const estado = b.Estado || "Abierto";
            const sev = b.Severidad || "";
            const casos = b.CasosRelacionados || "";
            const link = b.LinkCasoPrueba || "";
            const fecha = (function () {
                try {
                    return (
                        b.FechaDeteccion &&
                        new Date(b.FechaDeteccion).toLocaleDateString()
                    );
                } catch (e) {
                    return "";
                }
            })();
            const badge =
                estado === "Cerrado"
                    ? '<span class="badge badge-success">Cerrado</span>'
                    : '<span class="badge badge-danger">Abierto</span>';
            const linkHtml = link
                ? link
                      .split("\n")
                      .map(function (l) {
                          return '<a href="' + l + '" target="_blank">Link</a>';
                      })
                      .join("<br>")
                : "";

            const evidenciasRaw = b.EvidenciasURL || "";
            const tieneEvidencias =
                evidenciasRaw && String(evidenciasRaw).trim() !== "";
            const trelloUrl =
                b.TrelloCardURL || b.LinkTrello || b.LinkTrelloHU || "";

            html +=
                "<tr>" +
                "<td>" +
                id +
                "</td>" +
                "<td>" +
                (trelloUrl
                    ? '<a href="' +
                      trelloUrl +
                      '" target="_blank" style="font-weight:600;">' +
                      titulo +
                      "</a>"
                    : titulo) +
                (tieneEvidencias
                    ? ' <span title="Tiene evidencias" style="background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:12px;font-size:0.8rem;margin-left:6px;">📎</span>'
                    : "") +
                "</td>" +
                "<td>" +
                badge +
                "</td>" +
                "<td>" +
                sev +
                "</td>" +
                "<td>" +
                (casos || "") +
                "</td>" +
                "<td>" +
                linkHtml +
                "</td>" +
                "<td>" +
                (fecha || "") +
                "</td>" +
                '<td style="display:flex; gap:0.35rem; flex-wrap:wrap;">' +
                '<button class="btn btn-secondary btn-sm" onclick="abrirModalCrearBug(\'' +
                id +
                "')\">Ver/Editar</button>" +
                (estado === "Abierto"
                    ? '<button class="btn btn-success btn-sm" onclick="abrirModalCerrarBug(\'' +
                      id +
                      "')\">Cerrar</button>"
                    : '<button class="btn btn-primary btn-sm" onclick="cambiarEstadoBugUI(\'' +
                      id +
                      "','Abierto')\">Abrir</button>") +
                '<button class="btn btn-danger btn-sm" onclick="eliminarBugUI(\'' +
                id +
                "')\">Eliminar</button>" +
                "</td>" +
                "</tr>";
        });

        tbody.innerHTML = html;
    }

    function cambiarEstadoBugUI(bugId, nuevoEstado) {
        const url =
            typeof recuperarSheetUrl === "function"
                ? recuperarSheetUrl()
                : null;
        if (!url) return;
        if (typeof mostrarSpinner === "function") mostrarSpinner();
        google.script.run
            .withSuccessHandler(function (r) {
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                if (r && r.success) {
                    cargarBugs();
                    mostrarToast &&
                        mostrarToast("Estado actualizado", "success");
                } else {
                    mostrarToast &&
                        mostrarToast("Error: " + (r?.mensaje || ""), "error");
                }
            })
            .withFailureHandler(function (e) {
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                mostrarToast &&
                    mostrarToast("Error: " + (e?.message || e), "error");
            })
            .cambiarEstadoBug(url, bugId, nuevoEstado);
    }

    async function eliminarBugUI(bugId) {
        const confirmar =
            typeof mostrarConfirmacionApp === "function"
                ? await mostrarConfirmacionApp({
                      titulo: "Eliminar Bug",
                      icono: "⚠️",
                      mensaje:
                          "Al eliminar este bug, los casos vinculados que estén en No OK y sin otros bugs abiertos pasarán a <strong>Sin ejecutar</strong>. ¿Confirmás?",
                      textoOk: "Sí, eliminar",
                      textoCancelar: "Cancelar",
                  })
                : confirm(
                      "Eliminar bug " +
                          bugId +
                          "? Los casos con No OK podrían pasar a Sin ejecutar."
                  );
        if (!confirmar) return;
        const url =
            typeof recuperarSheetUrl === "function"
                ? recuperarSheetUrl()
                : null;
        if (!url) return;
        if (typeof mostrarSpinner === "function") mostrarSpinner();
        google.script.run
            .withSuccessHandler(function (r) {
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                if (r && r.success) {
                    if (typeof mostrarToast === "function")
                        mostrarToast("Bug eliminado", "success");
                    cargarBugs();
                    if (typeof cargarTodosLosCasos === "function")
                        cargarTodosLosCasos();
                } else {
                    if (typeof mostrarToast === "function")
                        mostrarToast("Error: " + (r?.mensaje || ""), "error");
                }
            })
            .withFailureHandler(function (e) {
                if (typeof ocultarSpinner === "function") ocultarSpinner();
                if (typeof mostrarToast === "function")
                    mostrarToast(
                        "Error eliminando bug: " + (e?.message || e),
                        "error"
                    );
            })
            .eliminarBug(url, bugId);
    }

    // Export globals
    window.mostrarPanelBugs = mostrarPanelBugs;
    window.ocultarPanelBugs = ocultarPanelBugs;
    window.cargarBugs = cargarBugs;
    window.renderizarTablaBugs = renderizarTablaBugsPaged;
    window.renderizarTablaBugsPaged = renderizarTablaBugsPaged;
    window.cambiarEstadoBugUI = cambiarEstadoBugUI;
    window.eliminarBugUI = eliminarBugUI;
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     FRONTEND_COMPONENTS_CASOS_CRUD.HTML
     Operaciones CRUD completas para casos de prueba
     Responsabilidad: Crear, Ver, Editar, Eliminar, Restaurar casos
     ═══════════════════════════════════════════════════════════════════════════ -->

<script>
    // ===================================================================
    // VARIABLES GLOBALES DE CRUD
    // ===================================================================

    (function () {
        if (!window.casoActualDetalle) window.casoActualDetalle = null;
        if (!window.formularioTieneCambios)
            window.formularioTieneCambios = false;

        console.log("✅ Variables globales de CRUD inicializadas");
    })();

    // ===================================================================
    // VER DETALLE DE CASO
    // ===================================================================

    /**
     * Obtiene y muestra el detalle completo de un caso
     * @param {string} casoId - ID del caso
     */
    function verDetalleCaso(casoId) {
        console.log("👁️ [CRUD] Viendo detalle de caso:", casoId);
        mostrarSpinner();

        google.script.run
            .withSuccessHandler(function (response) {
                ocultarSpinner();
                if (response.success) {
                    console.log("✅ [CRUD] Detalle obtenido");
                    window.casoActualDetalle = response.data;
                    mostrarModalDetalle(response.data);
                } else {
                    console.error("❌ [CRUD] Error:", response.mensaje);
                    mostrarToast("Error: " + response.mensaje, "error");
                }
            })
            .withFailureHandler(function (error) {
                ocultarSpinner();
                console.error("💥 [CRUD] Error crítico:", error);
                mostrarToast(
                    "Error al obtener detalle: " + error.message,
                    "error"
                );
            })
            .obtenerDetalleCaso(recuperarSheetUrl(), casoId);
    }

    /**
     * Muestra el modal con el detalle del caso
     * @param {Object} caso - Objeto con datos del caso
     */
    function mostrarModalDetalle(caso) {
        const esEliminado =
            caso.Estado === "Eliminado" || caso.EstadoDiseño === "Eliminado";

        // Actualizar título del modal (textContent es seguro)
        document.getElementById("detalleCasoIcono").textContent = esEliminado
            ? "👻"
            : "📋";
        document.getElementById("detalleCasoTitulo").textContent =
            "Detalle del Caso";

        // Función helper para sanitizar valores
        const safe = function (val) {
            return escapeHtml(val) || "-";
        };

        // Construir contenido con valores sanitizados
        let html = '<div class="detalle-grid">';
        html +=
            '<div class="detalle-label">🆔 ID:</div><div class="detalle-valor">' +
            safe(caso.ID) +
            "</div>";
        html +=
            '<div class="detalle-label">📂 Hoja/Módulo:</div><div class="detalle-valor">' +
            safe(caso.Hoja || "Casos") +
            "</div>";
        html +=
            '<div class="detalle-label">📋 Título:</div><div class="detalle-valor" style="word-wrap: break-word; overflow-wrap: break-word; white-space: normal; max-width: 100%;"><strong>' +
            safe(caso.Titulo) +
            "</strong></div>";
        html +=
            '<div class="detalle-label">📝 Descripción:</div><div class="detalle-valor" style="word-wrap: break-word; overflow-wrap: break-word; white-space: normal; max-width: 100%;">' +
            safe(caso.Descripcion) +
            "</div>";
        html +=
            '<div class="detalle-label">⚡ Prioridad:</div><div class="detalle-valor"><span class="badge ' +
            getBadgePrioridad(caso.Prioridad) +
            '">' +
            safe(caso.Prioridad) +
            "</span></div>";
        html +=
            '<div class="detalle-label">📊 Estado:</div><div class="detalle-valor"><span class="badge ' +
            getBadgeEstado(caso.Estado || caso.EstadoDiseño) +
            '">' +
            safe(caso.Estado || caso.EstadoDiseño) +
            "</span></div>";
        html +=
            '<div class="detalle-label">🔧 Formato:</div><div class="detalle-valor">' +
            safe(caso.Formato) +
            "</div>";
        html +=
            '<div class="detalle-label">🎯 Tipo de Prueba:</div><div class="detalle-valor">' +
            safe(caso.TipoPrueba) +
            "</div>";

        // Mostrar Ambiente y Navegador si existen
        if (caso.Ambiente || caso.Navegador) {
            html +=
                '<div class="detalle-label">🖥️ Ambiente:</div><div class="detalle-valor">' +
                safe(caso.Ambiente || "No especificado") +
                "</div>";
            html +=
                '<div class="detalle-label">🌐 Navegador:</div><div class="detalle-valor">' +
                safe(caso.Navegador || "No especificado") +
                "</div>";
        }

        html += "</div>";

        // Evidencias de última ejecución
        if (caso.EvidenciasURL && caso.EvidenciasURL.trim() !== "") {
            html += '<div class="detalle-seccion">';
            html +=
                '<div class="detalle-seccion-titulo">📸 Evidencias de Última Ejecución</div>';
            html +=
                '<div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;">';

            const evidencias = caso.EvidenciasURL.split(/\r?\n/).filter(
                function (url) {
                    return url && url.trim();
                }
            );

            evidencias.forEach(function (url, index) {
                const nombreArchivo = extraerNombreArchivo(url);
                const iconoInfo = obtenerIconoYTipo(url);
                const btnId = "evidencia-btn-" + Date.now() + "-" + index;

                html +=
                    '<a href="' +
                    url +
                    '" target="_blank" ' +
                    'id="' +
                    btnId +
                    '" ' +
                    'class="btn btn-secondary" ' +
                    'style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.9rem; text-decoration: none;" ' +
                    'title="Abrir ' +
                    nombreArchivo +
                    '">' +
                    '<span class="icono-evidencia" style="font-size: 1.3rem;">' +
                    iconoInfo.icon +
                    "</span>" +
                    '<span style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' +
                    safe(nombreArchivo) +
                    "</span>" +
                    "</a>";

                // Si es Drive, actualizar el icono asíncronamente
                if (url.toLowerCase().includes("drive.google.com")) {
                    setTimeout(function () {
                        obtenerIconoYTipo(url, function (iconoActualizado) {
                            const btn = document.getElementById(btnId);
                            if (btn) {
                                const spanIcono =
                                    btn.querySelector(".icono-evidencia");
                                if (spanIcono) {
                                    spanIcono.textContent =
                                        iconoActualizado.icon;
                                }
                            }
                        });
                    }, 100 * index); // Escalonar las peticiones
                }
            });

            html += "</div>";
            html += "</div>";
        }

        // Mostrar pasos según formato
        if (caso.Formato === "Clasico") {
            html += '<div class="detalle-seccion">';
            html += '<div class="detalle-seccion-titulo">📝 Pasos</div>';
            html +=
                '<div style="white-space: pre-wrap; background: #f8fafc; padding: 1rem; border-radius: 6px; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">' +
                safe(caso.Pasos || "No especificados") +
                "</div>";
            html += "</div>";

            html += '<div class="detalle-seccion">';
            html +=
                '<div class="detalle-seccion-titulo">✅ Resultado Esperado</div>';
            html +=
                '<div style="white-space: pre-wrap; background: #f8fafc; padding: 1rem; border-radius: 6px; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">' +
                safe(caso.ResultadoEsperado || "No especificado") +
                "</div>";
            html += "</div>";
        } else if (caso.Formato === "Gherkin") {
            html += '<div class="detalle-seccion">';
            html +=
                '<div class="detalle-seccion-titulo">🥒 Escenario Gherkin</div>';
            html +=
                '<div style="white-space: pre-wrap; background: #f8fafc; padding: 1rem; border-radius: 6px;">';
            html +=
                "<strong>Given:</strong> " + safe(caso.ScenarioGiven) + "<br>";
            html +=
                "<strong>When:</strong> " + safe(caso.ScenarioWhen) + "<br>";
            html += "<strong>Then:</strong> " + safe(caso.ScenarioThen);
            html += "</div>";
            html += "</div>";
        }

        // Precondiciones
        if (caso.Precondiciones) {
            html += '<div class="detalle-seccion">';
            html +=
                '<div class="detalle-seccion-titulo">⚙️ Precondiciones</div>';
            html +=
                '<div style="white-space: pre-wrap; background: #f8fafc; padding: 1rem; border-radius: 6px; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">' +
                safe(caso.Precondiciones) +
                "</div>";
            html += "</div>";
        }

        // Información adicional
        html += '<div class="detalle-seccion">';
        html +=
            '<div class="detalle-seccion-titulo">ℹ️ Información Adicional</div>';
        html += '<div class="detalle-grid">';
        html +=
            '<div class="detalle-label">🔄 Regresión:</div><div class="detalle-valor">' +
            (caso.CandidatoRegresion === "Si" ||
            caso.CandidatoRegresion === "Sí"
                ? "✅ Sí"
                : "❌ No") +
            "</div>";
        html +=
            '<div class="detalle-label">👤 Creado por:</div><div class="detalle-valor">' +
            safe(caso.CreadoPor) +
            "</div>";
        html +=
            '<div class="detalle-label">📅 Fecha creación:</div><div class="detalle-valor">' +
            (caso.FechaCreacion
                ? safe(formatearFecha(caso.FechaCreacion))
                : "-") +
            "</div>";
        html +=
            '<div class="detalle-label">🔗 URI:</div><div class="detalle-valor" style="font-family: monospace; font-size: 0.85rem;">' +
            safe(caso.CasoURI) +
            "</div>";
        html += "</div>";
        html += "</div>";

        // Notas
        if (caso.Notas) {
            html += '<div class="detalle-seccion">';
            html += '<div class="detalle-seccion-titulo">📌 Notas</div>';
            html +=
                '<div style="white-space: pre-wrap; background: #fef3c7; padding: 1rem; border-radius: 6px; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">' +
                safe(caso.Notas) +
                "</div>";
            html += "</div>";
        }

        document.getElementById("detalleCasoContenido").innerHTML = html;

        // Mostrar/ocultar botones según estado
        if (esEliminado) {
            document
                .getElementById("btnEditarCasoDetalle")
                .classList.add("hidden");
            document
                .getElementById("btnEliminarCasoDetalle")
                .classList.add("hidden");
            document
                .getElementById("btnRestaurarCasoDetalle")
                .classList.remove("hidden");
        } else {
            document
                .getElementById("btnEditarCasoDetalle")
                .classList.remove("hidden");
            document
                .getElementById("btnEliminarCasoDetalle")
                .classList.remove("hidden");
            document
                .getElementById("btnRestaurarCasoDetalle")
                .classList.add("hidden");
        }

        abrirModal("modalDetalleCaso");
    }

    // ===================================================================
    // EDITAR CASO
    // ===================================================================

    /**
     * Obtiene un caso y lo carga en el formulario para editar
     * @param {string} casoId - ID del caso
     */
    function editarCaso(casoId) {
        console.log("✏️ [CRUD] Editando caso:", casoId);
        mostrarSpinner();

        google.script.run
            .withSuccessHandler(function (response) {
                ocultarSpinner();
                if (response.success) {
                    console.log("✅ [CRUD] Caso obtenido para edición");
                    cargarCasoEnFormulario(response.data);
                } else {
                    console.error("❌ [CRUD] Error:", response.mensaje);
                    mostrarToast("Error: " + response.mensaje, "error");
                }
            })
            .withFailureHandler(function (error) {
                ocultarSpinner();
                console.error("💥 [CRUD] Error crítico:", error);
                mostrarToast(
                    "Error al obtener caso: " + error.message,
                    "error"
                );
            })
            .obtenerDetalleCaso(recuperarSheetUrl(), casoId);
    }

    /**
     * Edita el caso desde el modal de detalle
     */
    function editarCasoDesdeDetalle() {
        if (window.casoActualDetalle) {
            console.log("✏️ [CRUD] Editando desde detalle");
            cerrarModal("modalDetalleCaso");
            cargarCasoEnFormulario(window.casoActualDetalle);
        }
    }

    /**
     * Carga los datos de un caso en el formulario
     * @param {Object} caso - Objeto con datos del caso
     */
    function cargarCasoEnFormulario(caso) {
        console.log("📝 [CRUD] Cargando caso en formulario:", caso);

        // Cambiar título del modal
        document.getElementById("tituloModalCaso").textContent =
            "✏️ Editar Caso: " + caso.ID;

        // Guardar datos de edición
        document.getElementById("casoIdEdicion").value = caso.ID;

        const hojaOriginal = caso.Hoja || "Casos";
        document.getElementById("casoHojaOriginal").value = hojaOriginal;

        console.log("📂 [CRUD] Hoja original del caso:", hojaOriginal);

        // Llenar campos con delay para asegurar que el DOM esté listo
        setTimeout(() => {
            try {
                // Select de hoja
                const selectHoja = document.getElementById("casoHoja");
                if (selectHoja) {
                    // Verificar si la hoja existe en el select
                    let hojaEncontrada = false;

                    for (let i = 0; i < selectHoja.options.length; i++) {
                        if (selectHoja.options[i].value === hojaOriginal) {
                            hojaEncontrada = true;
                            break;
                        }
                    }

                    // Si no está, agregarla temporalmente
                    if (
                        !hojaEncontrada &&
                        hojaOriginal !== "" &&
                        hojaOriginal !== "Casos"
                    ) {
                        const option = document.createElement("option");
                        option.value = hojaOriginal;
                        option.textContent = hojaOriginal;
                        selectHoja.insertBefore(option, selectHoja.options[1]);
                        console.log(
                            "➕ [CRUD] Hoja agregada temporalmente al select:",
                            hojaOriginal
                        );
                    }

                    // Seleccionar la hoja
                    if (hojaOriginal === "Casos" || hojaOriginal === "") {
                        selectHoja.value = "";
                    } else {
                        selectHoja.value = hojaOriginal;
                    }

                    console.log(
                        "✅ [CRUD] Hoja seleccionada:",
                        selectHoja.value || "(vacío = Casos default)"
                    );
                }

                // Formato
                const selectFormato = document.getElementById("casoFormato");
                if (selectFormato) {
                    selectFormato.value = caso.Formato || "Clasico";
                }

                // Campos de texto
                document.getElementById("casoTitulo").value = caso.Titulo || "";
                document.getElementById("casoDescripcion").value =
                    caso.Descripcion || "";

                // Prioridad
                const selectPrioridad =
                    document.getElementById("casoPrioridad");
                if (selectPrioridad) {
                    selectPrioridad.value = caso.Prioridad || "Media";
                }

                // Estado Diseño
                const selectEstadoDiseño =
                    document.getElementById("casoEstadoDiseño");
                if (selectEstadoDiseño) {
                    const estadoDiseño =
                        caso.EstadoDiseño || caso.Estado || "Pendiente";
                    selectEstadoDiseño.value = estadoDiseño;
                    // Guardar el estado original para comparar luego
                    window.estadoDiseñoOriginal = estadoDiseño;
                }

                // Tipo de prueba
                const selectTipo = document.getElementById("casoTipoPrueba");
                if (selectTipo) {
                    selectTipo.value = caso.TipoPrueba || "Funcional";
                }

                // Campos según formato
                if (caso.Formato === "Clasico") {
                    document.getElementById("casoPasos").value =
                        caso.Pasos || "";
                    document.getElementById("casoResultadoEsperado").value =
                        caso.ResultadoEsperado || "";
                } else if (caso.Formato === "Gherkin") {
                    document.getElementById("casoGiven").value =
                        caso.ScenarioGiven || "";
                    document.getElementById("casoWhen").value =
                        caso.ScenarioWhen || "";
                    document.getElementById("casoThen").value =
                        caso.ScenarioThen || "";
                }

                // Precondiciones
                document.getElementById("casoPrecondiciones").value =
                    caso.Precondiciones || "";

                // Checkboxes
                document.getElementById("casoCandidatoRegresion").checked =
                    caso.CandidatoRegresion === "Si" ||
                    caso.CandidatoRegresion === "Sí";

                // Mostrar campos según formato
                cambiarFormatoCaso();

                // Resetear flag de cambios
                window.formularioTieneCambios = false;

                // Configurar listeners de cambios
                const inputs = document.querySelectorAll(
                    "#formCrearCaso input, #formCrearCaso textarea, #formCrearCaso select"
                );
                inputs.forEach((input) => {
                    input.removeEventListener("change", marcarCambios);
                    input.removeEventListener("input", marcarCambios);
                    input.addEventListener("change", marcarCambios);
                    input.addEventListener("input", marcarCambios);
                });

                console.log("✅ [CRUD] Formulario cargado completamente");
            } catch (error) {
                console.error("❌ [CRUD] Error llenando formulario:", error);
                mostrarToast("Error al cargar datos del caso", "error");
            }
        }, 150);

        // Abrir modal con toda la funcionalidad (trap de foco, cerrar al hacer clic fuera, etc.)
        setTimeout(() => {
            abrirModal("modalCrearCaso");
        }, 200);
    }

    // ===================================================================
    // MODAL CREAR/EDITAR
    // ===================================================================

    /**
     * Abre el modal para crear un nuevo caso
     */
    function abrirModalCrearCaso() {
        console.log("➕ [CRUD] Abriendo modal para crear nuevo caso");

        // Cambiar título
        document.getElementById("tituloModalCaso").textContent =
            "➕ Nuevo Caso de Prueba";
        document.getElementById("casoIdEdicion").value = "";
        document.getElementById("casoHojaOriginal").value = "";

        // Abrir modal
        abrirModal("modalCrearCaso");

        // Resetear formulario
        document.getElementById("formCrearCaso").reset();

        // Mostrar campos según formato
        cambiarFormatoCaso();

        // Resetear flag de cambios
        window.formularioTieneCambios = false;

        // ⭐ IMPORTANTE: Recargar hojas disponibles para detectar cambios en el Sheet
        // (Si el usuario borró una hoja en Excel, la app debe detectarlo)
        if (typeof cargarHojasDisponibles === "function") {
            cargarHojasDisponibles();
        }

        // Configurar listeners de cambios
        const inputs = document.querySelectorAll(
            "#formCrearCaso input, #formCrearCaso textarea, #formCrearCaso select"
        );
        inputs.forEach((input) => {
            input.removeEventListener("change", marcarCambios);
            input.removeEventListener("input", marcarCambios);
            input.addEventListener("change", marcarCambios);
            input.addEventListener("input", marcarCambios);
        });
    }

    /**
     * Cierra el modal de crear/editar caso
     */
    async function cerrarModalCaso() {
        if (window.formularioTieneCambios) {
            const confirmar = await mostrarConfirmacionApp({
                titulo: "Cambios sin guardar",
                mensaje:
                    "Tienes cambios sin guardar.<br><br>¿Deseas descartar los cambios y cerrar?",
                icono: "⚠️",
                textoOk: "Descartar cambios",
                textoCancelar: "Seguir editando",
            });

            if (confirmar) {
                cerrarModal("modalCrearCaso");
                window.formularioTieneCambios = false;

                // Resetear formulario
                document.getElementById("formCrearCaso").reset();
                document.getElementById("casoIdEdicion").value = "";
                document.getElementById("casoHojaOriginal").value = "";
                document.getElementById("tituloModalCaso").textContent =
                    "➕ Nuevo Caso de Prueba";

                // Mostrar toast si había hoja recién creada
                if (window.hojaRecienCreada) {
                    setTimeout(() => {
                        mostrarToast(
                            '💡 La hoja "' +
                                window.hojaRecienCreada +
                                '" quedó guardada en tu Google Sheet',
                            "info",
                            4000
                        );
                    }, 500);
                    window.hojaRecienCreada = null;
                }
            }
        } else {
            cerrarModal("modalCrearCaso");
            document.getElementById("formCrearCaso").reset();
            document.getElementById("casoIdEdicion").value = "";
            document.getElementById("casoHojaOriginal").value = "";
            document.getElementById("tituloModalCaso").textContent =
                "➕ Nuevo Caso de Prueba";

            if (window.hojaRecienCreada) {
                window.hojaRecienCreada = null;
            }
        }
    }

    /**
     * Cambia la visibilidad de campos según el formato seleccionado
     */
    function cambiarFormatoCaso() {
        const formato = document.getElementById("casoFormato").value;
        const camposClasico = document.getElementById("camposClasico");
        const camposGherkin = document.getElementById("camposGherkin");

        if (formato === "Gherkin") {
            camposClasico.classList.add("hidden");
            camposGherkin.classList.remove("hidden");

            // Remover required de campos clásicos
            document.getElementById("casoPasos").removeAttribute("required");
            document
                .getElementById("casoResultadoEsperado")
                .removeAttribute("required");

            // Agregar required a campos Gherkin
            document
                .getElementById("casoGiven")
                .setAttribute("required", "required");
            document
                .getElementById("casoWhen")
                .setAttribute("required", "required");
            document
                .getElementById("casoThen")
                .setAttribute("required", "required");
        } else {
            camposClasico.classList.remove("hidden");
            camposGherkin.classList.add("hidden");

            // Agregar required a campos clásicos
            document
                .getElementById("casoPasos")
                .setAttribute("required", "required");
            document
                .getElementById("casoResultadoEsperado")
                .setAttribute("required", "required");

            // Remover required de campos Gherkin
            document.getElementById("casoGiven").removeAttribute("required");
            document.getElementById("casoWhen").removeAttribute("required");
            document.getElementById("casoThen").removeAttribute("required");
        }
    }

    // ===================================================================
    // GUARDAR CASO (CREAR O ACTUALIZAR)
    // ===================================================================

    /**
     * Guarda el caso (crea nuevo o actualiza existente)
     */
    async function guardarCaso() {
        // Validar campos requeridos del formulario
        const form = document.getElementById("formCrearCaso");
        if (form && !form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const formato = document.getElementById("casoFormato").value;
        const hojaSeleccionada = document.getElementById("casoHoja").value;
        const urlActual = recuperarSheetUrl();
        const casoIdEdicion = document.getElementById("casoIdEdicion").value;
        const hojaOriginal = document.getElementById("casoHojaOriginal").value;
        const modoEdicion = casoIdEdicion !== "";
        const estadoDiseño = document.getElementById("casoEstadoDiseño").value;

        console.log(
            "💾 [CRUD] Guardando caso - Modo:",
            modoEdicion ? "EDICIÓN" : "CREAR"
        );
        console.log("  Hoja seleccionada:", hojaSeleccionada || "Casos");
        console.log("  Hoja original:", hojaOriginal);
        console.log("  Estado Diseño:", estadoDiseño);

        if (!urlActual) {
            mostrarToast("Error: No hay Sheet conectado", "error");
            return;
        }

        // Validar si está cambiando a "Completado"
        if (estadoDiseño === "Completado") {
            // En modo edición, verificar el estado anterior
            if (
                modoEdicion &&
                window.estadoDiseñoOriginal &&
                window.estadoDiseñoOriginal !== "Completado"
            ) {
                const confirmar = await mostrarConfirmacionApp({
                    titulo: "Marcar como Completado",
                    mensaje:
                        "¿Estás seguro de marcar este caso como <strong>Completado</strong>?<br><br>" +
                        "Esto indica que el diseño del caso está finalizado y listo para ser ejecutado.",
                    icono: "✅",
                    textoOk: "Sí, Completar",
                    textoCancelar: "Cancelar",
                });

                if (!confirmar) return;
            }
        }

        // Validar si no hay hoja seleccionada en modo crear
        if (!hojaSeleccionada && !modoEdicion) {
            const confirmar = await mostrarConfirmacionApp({
                titulo: "Hoja no seleccionada",
                mensaje:
                    'El caso se guardará en la hoja <strong>"Casos"</strong> por defecto.<br><br>¿Deseas continuar?',
                icono: "📋",
                textoOk: 'Guardar en "Casos"',
                textoCancelar: "Seleccionar hoja",
            });

            if (!confirmar) return;
        }

        if (modoEdicion) {
            // ═══════════════════════════════════════════════════════════
            // MODO EDICIÓN
            // ═══════════════════════════════════════════════════════════

            const hojaFinal = hojaSeleccionada || "Casos";
            const cambioDeHoja = hojaFinal !== hojaOriginal;

            console.log("🔍 [CRUD] Detectando cambio de hoja:", cambioDeHoja);

            if (cambioDeHoja) {
                // Usuario cambió la hoja → MOVER caso
                console.log(
                    "📦 [CRUD] Se detectó cambio de hoja, iniciando movimiento..."
                );

                const confirmar = await mostrarConfirmacionApp({
                    titulo: "Mover Caso",
                    mensaje:
                        "⚠️ <strong>Estás cambiando la hoja de este caso</strong><br><br>" +
                        'De: <strong>"' +
                        hojaOriginal +
                        '"</strong><br>' +
                        'A: <strong>"' +
                        hojaFinal +
                        '"</strong><br><br>' +
                        'El caso desaparecerá de "' +
                        hojaOriginal +
                        '" y aparecerá en "' +
                        hojaFinal +
                        '".<br><br>' +
                        "El ID <strong>" +
                        casoIdEdicion +
                        "</strong> se mantendrá igual.<br><br>" +
                        "¿Continuar?",
                    icono: "📦",
                    textoOk: "Sí, Mover Caso",
                    textoCancelar: "Cancelar",
                });

                if (!confirmar) {
                    console.log("❌ [CRUD] Usuario canceló el movimiento");
                    return;
                }

                // Primero MOVER el caso
                console.log(
                    "📦 [CRUD] Moviendo caso " +
                        casoIdEdicion +
                        " a hoja: " +
                        hojaFinal
                );
                mostrarSpinner();

                google.script.run
                    .withSuccessHandler(function (responseMover) {
                        console.log(
                            "📦 [CRUD] Respuesta de moverCaso:",
                            responseMover
                        );

                        if (responseMover.success) {
                            console.log(
                                "✅ [CRUD] Caso movido exitosamente, ahora actualizando campos..."
                            );

                            // LUEGO actualizar los demás campos en la nueva ubicación
                            const datosActualizados =
                                construirDatosActualizados(formato, hojaFinal);

                            google.script.run
                                .withSuccessHandler(function (
                                    responseActualizar
                                ) {
                                    ocultarSpinner();

                                    if (responseActualizar.success) {
                                        mostrarToast(
                                            "✅ Caso movido y actualizado exitosamente",
                                            "success"
                                        );
                                        window.formularioTieneCambios = false;
                                        window.hojaRecienCreada = null;
                                        cerrarModal("modalCrearCaso");
                                        cargarTodosLosCasos(true); // skipSpinner
                                    } else {
                                        mostrarToast(
                                            "Caso movido pero no se pudieron actualizar todos los campos: " +
                                                responseActualizar.mensaje,
                                            "warning"
                                        );
                                        cargarTodosLosCasos(true); // skipSpinner
                                    }
                                })
                                .withFailureHandler(function (error) {
                                    ocultarSpinner();
                                    mostrarToast(
                                        "Caso movido pero error al actualizar: " +
                                            error.message,
                                        "warning"
                                    );
                                    cargarTodosLosCasos(true); // skipSpinner
                                })
                                .actualizarCaso(
                                    urlActual,
                                    casoIdEdicion,
                                    datosActualizados
                                );
                        } else {
                            ocultarSpinner();
                            mostrarToast(
                                "Error al mover: " + responseMover.mensaje,
                                "error"
                            );
                        }
                    })
                    .withFailureHandler(function (error) {
                        ocultarSpinner();
                        console.error("💥 [CRUD] Error al mover caso:", error);
                        mostrarToast(
                            "Error al mover caso: " + error.message,
                            "error"
                        );
                    })
                    .moverCaso(urlActual, casoIdEdicion, hojaFinal);
            } else {
                // NO cambió de hoja → ACTUALIZACIÓN NORMAL
                console.log("✏️ [CRUD] Actualización normal (sin mover)");

                const datosActualizados = construirDatosActualizados(
                    formato,
                    hojaFinal
                );

                mostrarSpinner();

                google.script.run
                    .withSuccessHandler(function (response) {
                        ocultarSpinner();

                        if (response.success) {
                            mostrarToast(
                                "✅ Caso actualizado exitosamente",
                                "success"
                            );
                            window.formularioTieneCambios = false;
                            window.hojaRecienCreada = null;
                            cerrarModal("modalCrearCaso");
                            cargarTodosLosCasos(true); // skipSpinner
                        } else {
                            ocultarSpinner();
                            mostrarToast("Error: " + response.mensaje, "error");
                        }
                    })
                    .withFailureHandler(function (error) {
                        ocultarSpinner();
                        mostrarToast(
                            "Error al actualizar: " + error.message,
                            "error"
                        );
                    })
                    .actualizarCaso(
                        urlActual,
                        casoIdEdicion,
                        datosActualizados
                    );
            }
        } else {
            // ═══════════════════════════════════════════════════════════
            // MODO CREAR
            // ═══════════════════════════════════════════════════════════

            const hojaFinal = hojaSeleccionada || "Casos";

            const datosCaso = {
                sheetUrl: urlActual,
                hoja: hojaFinal,
                titulo: document.getElementById("casoTitulo").value,
                descripcion: document.getElementById("casoDescripcion").value,
                prioridad: document.getElementById("casoPrioridad").value,
                estadoDiseño: document.getElementById("casoEstadoDiseño").value,
                tipoPrueba: document.getElementById("casoTipoPrueba").value,
                formatoCaso: formato,
                candidatoRegresion: document.getElementById(
                    "casoCandidatoRegresion"
                ).checked,
                precondiciones:
                    document.getElementById("casoPrecondiciones").value,
            };

            if (formato === "Clasico") {
                datosCaso.pasos = document.getElementById("casoPasos").value;
                datosCaso.resultadoEsperado = document.getElementById(
                    "casoResultadoEsperado"
                ).value;
            } else {
                datosCaso.scenarioGiven =
                    document.getElementById("casoGiven").value;
                datosCaso.scenarioWhen =
                    document.getElementById("casoWhen").value;
                datosCaso.scenarioThen =
                    document.getElementById("casoThen").value;
            }

            console.log("➕ [CRUD] Creando nuevo caso en hoja:", hojaFinal);
            console.log("📦 [CRUD] Datos del caso:", datosCaso);

            // Mostrar spinner inmediatamente para feedback al usuario
            mostrarSpinner();

            google.script.run
                .withSuccessHandler(function (response) {
                    console.log("✅ [CRUD] Respuesta del servidor:", response);

                    if (response.success) {
                        const hojaUsada = response.data.hoja || "Casos";
                        const idCaso = response.data.idCaso || "TC-X";
                        const mensaje =
                            "✅ Caso " +
                            idCaso +
                            ' creado exitosamente en hoja "' +
                            hojaUsada +
                            '"';

                        console.log(
                            "💾 [CRUD] Caso creado exitosamente:",
                            idCaso
                        );
                        console.log(
                            "📋 [CRUD] Cerrando modal y recargando casos..."
                        );

                        window.formularioTieneCambios = false;
                        window.hojaRecienCreada = null;
                        cerrarModal("modalCrearCaso");

                        // Recargar casos inmediatamente - el backend ya confirmó el guardado
                        if (typeof cargarTodosLosCasos === "function") {
                            console.log(
                                "🔄 [CRUD] Llamando a cargarTodosLosCasos..."
                            );
                            cargarTodosLosCasos(true); // true = skipSpinner (ya está visible)
                            mostrarToast(mensaje, "success");
                        } else {
                            console.error(
                                "❌ cargarTodosLosCasos no está disponible"
                            );
                            mostrarToast(mensaje, "success");
                        }
                    } else {
                        ocultarSpinner();
                        mostrarToast("Error: " + response.mensaje, "error");
                    }
                })
                .withFailureHandler(function (error) {
                    ocultarSpinner();
                    mostrarToast(
                        "Error al crear caso: " + error.message,
                        "error"
                    );
                })
                .crearCaso(datosCaso);
        }
    }

    /**
     * Construye el objeto con datos actualizados
     */
    function construirDatosActualizados(formato, hojaFinal) {
        const datosActualizados = {
            Hoja: hojaFinal,
            Formato: formato,
            Titulo: document.getElementById("casoTitulo").value,
            Descripcion: document.getElementById("casoDescripcion").value,
            Prioridad: document.getElementById("casoPrioridad").value,
            EstadoDiseño: document.getElementById("casoEstadoDiseño").value,
            TipoPrueba: document.getElementById("casoTipoPrueba").value,
            Precondiciones: document.getElementById("casoPrecondiciones").value,
            CandidatoRegresion: document.getElementById(
                "casoCandidatoRegresion"
            ).checked
                ? "Si"
                : "No",
        };

        if (formato === "Clasico") {
            datosActualizados.Pasos =
                document.getElementById("casoPasos").value;
            datosActualizados.ResultadoEsperado = document.getElementById(
                "casoResultadoEsperado"
            ).value;
            datosActualizados.ScenarioGiven = "";
            datosActualizados.ScenarioWhen = "";
            datosActualizados.ScenarioThen = "";
        } else {
            datosActualizados.ScenarioGiven =
                document.getElementById("casoGiven").value;
            datosActualizados.ScenarioWhen =
                document.getElementById("casoWhen").value;
            datosActualizados.ScenarioThen =
                document.getElementById("casoThen").value;
            datosActualizados.Pasos = "";
            datosActualizados.ResultadoEsperado = "";
        }

        return datosActualizados;
    }

    /**
     * Obtiene el icono y tipo basado en el tipo MIME
     * @param {string} mimeType - Tipo MIME del archivo
     * @returns {object} - {icon, tipo, extension}
     */
    function obtenerIconoPorMime(mimeType) {
        if (!mimeType) return { icon: "📎", tipo: "Archivo", extension: "" };

        const mime = mimeType.toLowerCase();

        // Imágenes
        if (mime.startsWith("image/")) {
            const ext = mime.split("/")[1].toUpperCase();
            return { icon: "🖼️", tipo: "Imagen", extension: ext };
        }

        // Videos
        if (mime.startsWith("video/")) {
            const ext = mime.split("/")[1].toUpperCase();
            return { icon: "🎥", tipo: "Video", extension: ext };
        }

        // PDFs
        if (mime === "application/pdf") {
            return { icon: "📄", tipo: "Documento", extension: "PDF" };
        }

        // Documentos
        if (
            mime.includes("document") ||
            mime.includes("msword") ||
            mime.includes("text/")
        ) {
            return { icon: "📝", tipo: "Documento", extension: "DOC" };
        }

        // Hojas de cálculo
        if (mime.includes("spreadsheet") || mime.includes("excel")) {
            return { icon: "📊", tipo: "Hoja de cálculo", extension: "XLS" };
        }

        // Presentaciones
        if (mime.includes("presentation") || mime.includes("powerpoint")) {
            return { icon: "📽️", tipo: "Presentación", extension: "PPT" };
        }

        // Archivos comprimidos
        if (
            mime.includes("zip") ||
            mime.includes("rar") ||
            mime.includes("compressed")
        ) {
            return { icon: "📦", tipo: "Comprimido", extension: "ZIP" };
        }

        // Audio
        if (mime.startsWith("audio/")) {
            const ext = mime.split("/")[1].toUpperCase();
            return { icon: "🎵", tipo: "Audio", extension: ext };
        }

        return { icon: "☁️", tipo: "Drive", extension: "" };
    }

    /**
     * Obtiene el icono y tipo basado en la extensión del archivo o URL de Drive
     * @param {string} url - URL del archivo
     * @param {function} callback - Callback para respuesta asíncrona (opcional)
     * @returns {object} - {icon, tipo, extension}
     */
    function obtenerIconoYTipo(url, callback) {
        if (!url || typeof url !== "string") {
            const resultado = { icon: "📎", tipo: "Archivo", extension: "" };
            if (callback) callback(resultado);
            return resultado;
        }

        const urlLower = url.toLowerCase();

        // Si es Drive y tenemos callback, consultar el tipo MIME
        if (urlLower.includes("drive.google.com") && callback) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        const iconoInfo = obtenerIconoPorMime(
                            response.mimeType
                        );
                        callback(iconoInfo);
                    } else {
                        callback({ icon: "☁️", tipo: "Drive", extension: "" });
                    }
                })
                .withFailureHandler(function () {
                    callback({ icon: "☁️", tipo: "Drive", extension: "" });
                })
                .obtenerTipoArchivoDrive(url);

            // Retornar temporalmente el icono de Drive
            return { icon: "☁️", tipo: "Drive", extension: "" };
        }

        // Imágenes
        if (/\.(jpg|jpeg|png|gif|bmp|webp|svg)($|\?|&)/.test(urlLower)) {
            return {
                icon: "🖼️",
                tipo: "Imagen",
                extension:
                    urlLower
                        .match(/\.(jpg|jpeg|png|gif|bmp|webp|svg)/i)?.[1]
                        .toUpperCase() || "IMG",
            };
        }

        // Videos
        if (/\.(mp4|mov|avi|wmv|flv|mkv|webm)($|\?|&)/.test(urlLower)) {
            return {
                icon: "🎥",
                tipo: "Video",
                extension:
                    urlLower
                        .match(/\.(mp4|mov|avi|wmv|flv|mkv|webm)/i)?.[1]
                        .toUpperCase() || "VIDEO",
            };
        }

        // PDFs
        if (/\.pdf($|\?|&)/.test(urlLower)) {
            return { icon: "📄", tipo: "Documento", extension: "PDF" };
        }

        // Documentos
        if (/\.(doc|docx|txt|rtf)($|\?|&)/.test(urlLower)) {
            return {
                icon: "📝",
                tipo: "Documento",
                extension:
                    urlLower
                        .match(/\.(doc|docx|txt|rtf)/i)?.[1]
                        .toUpperCase() || "DOC",
            };
        }

        // Hojas de cálculo
        if (/\.(xls|xlsx|csv)($|\?|&)/.test(urlLower)) {
            return {
                icon: "📊",
                tipo: "Hoja de cálculo",
                extension:
                    urlLower.match(/\.(xls|xlsx|csv)/i)?.[1].toUpperCase() ||
                    "XLS",
            };
        }

        // Presentaciones
        if (/\.(ppt|pptx)($|\?|&)/.test(urlLower)) {
            return {
                icon: "📽️",
                tipo: "Presentación",
                extension:
                    urlLower.match(/\.(ppt|pptx)/i)?.[1].toUpperCase() || "PPT",
            };
        }

        // Archivos comprimidos
        if (/\.(zip|rar|7z|tar|gz)($|\?|&)/.test(urlLower)) {
            return {
                icon: "📦",
                tipo: "Archivo comprimido",
                extension:
                    urlLower
                        .match(/\.(zip|rar|7z|tar|gz)/i)?.[1]
                        .toUpperCase() || "ZIP",
            };
        }

        // Archivos de audio
        if (/\.(mp3|wav|ogg|m4a|flac)($|\?|&)/.test(urlLower)) {
            return {
                icon: "🎵",
                tipo: "Audio",
                extension:
                    urlLower
                        .match(/\.(mp3|wav|ogg|m4a|flac)/i)?.[1]
                        .toUpperCase() || "AUDIO",
            };
        }

        // Google Drive (si no tiene extensión específica)
        if (urlLower.includes("drive.google.com")) {
            return { icon: "☁️", tipo: "Drive", extension: "" };
        }

        // Por defecto
        return { icon: "📎", tipo: "Archivo", extension: "" };
    }

    /**
     * Extrae el nombre del archivo desde una URL de Google Drive
     * @param {string} url - URL de Google Drive
     * @returns {string} - Nombre del archivo o "Evidencia"
     */
    function extraerNombreArchivo(url) {
        try {
            // Intentar extraer el nombre del archivo desde el parámetro de la URL
            // Las URLs de Google Drive tienen formato: https://drive.google.com/file/d/FILE_ID/view
            // o pueden tener el nombre en algún parámetro

            if (!url || typeof url !== "string") return "Evidencia";

            // Si tiene extensión de archivo en la URL, extraer el nombre completo
            const matchExt = url.match(
                /\/([^\/]+\.(jpg|jpeg|png|gif|bmp|webp|svg|pdf|mp4|mov|avi|wmv|doc|docx|txt|xls|xlsx|zip|rar))(\?|$)/i
            );
            if (matchExt) {
                // Decodificar el nombre del archivo
                try {
                    return decodeURIComponent(matchExt[1]);
                } catch (e) {
                    return matchExt[1];
                }
            }

            // Si la URL contiene "id=" extraer el ID
            const match = url.match(/[?&]id=([^&]+)/);
            if (match) {
                const iconoInfo = obtenerIconoYTipo(url);
                return (
                    iconoInfo.tipo +
                    " " +
                    match[1].substring(0, 8) +
                    "..." +
                    (iconoInfo.extension
                        ? " (" + iconoInfo.extension + ")"
                        : "")
                );
            }

            // Si la URL contiene /d/ extraer el ID
            const matchD = url.match(/\/d\/([^\/]+)/);
            if (matchD) {
                const iconoInfo = obtenerIconoYTipo(url);
                return (
                    iconoInfo.tipo +
                    " " +
                    matchD[1].substring(0, 8) +
                    "..." +
                    (iconoInfo.extension
                        ? " (" + iconoInfo.extension + ")"
                        : "")
                );
            }

            return "Evidencia";
        } catch (e) {
            console.warn("Error extrayendo nombre de archivo:", e);
            return "Evidencia";
        }
    }

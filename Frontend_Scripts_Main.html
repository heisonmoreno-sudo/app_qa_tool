    function mostrarSpinner() {
        const overlay = document.getElementById("loadingOverlay");
        if (overlay) {
            overlay.classList.add("active");

            // Mensajes aleatorios de carga
            const mensajes = [
                "Preparando tu arsenal de testing...",
                "Cargando casos de prueba...",
                "Sincronizando con el servidor...",
                "Configurando workspace...",
                "Casi listo...",
                "Verificando permisos...",
                "Conectando con Google Sheets...",
            ];

            const tips = [
                "💡 Tip: Organiza tus casos por módulos",
                "💡 Tip: Usa etiquetas descriptivas en tus bugs",
                "💡 Tip: Los casos críticos van primero",
                "💡 Tip: Documenta los pasos claramente",
                "💡 Tip: Adjunta evidencias a tus ejecuciones",
            ];

            const mensajeAleatorio =
                mensajes[Math.floor(Math.random() * mensajes.length)];
            const tipAleatorio = tips[Math.floor(Math.random() * tips.length)];

            const loadingMessage = document.getElementById("loadingMessage");
            const loadingTip = document.getElementById("loadingTip");

            if (loadingMessage) loadingMessage.textContent = mensajeAleatorio;
            if (loadingTip) loadingTip.textContent = tipAleatorio;
        }
    }

    function ocultarSpinner() {
        const overlay = document.getElementById("loadingOverlay");
        if (overlay) {
            overlay.classList.remove("active");
        }

        // Restaurar overflow del body como medida de seguridad
        // Solo si no hay modales activos
        try {
            const modalesActivos = document.querySelectorAll(
                ".modal-overlay.active"
            );
            if (modalesActivos.length === 0) {
                document.body.style.overflow = "auto";
            }
        } catch (e) {
            console.warn("Error al restaurar overflow:", e);
        }
    }

    /**
     * Función de emergencia para restaurar el scroll si se queda bloqueado
     */
    function restaurarScroll() {
        console.log("🔧 Restaurando scroll del body...");
        try {
            document.body.style.overflow = "auto";
            document.body.style.overflowY = "auto";
            document.documentElement.style.overflow = "auto";
            document.documentElement.style.overflowY = "auto";

            // Limpiar stack de modales si está vacío pero hay clases activas
            const modalesActivos = document.querySelectorAll(
                ".modal-overlay.active"
            );
            if (modalesActivos.length > 0 && modalStack.length === 0) {
                console.warn(
                    "⚠️ Detectados modales activos sin stack, limpiando..."
                );
                modalesActivos.forEach(function (modal) {
                    modal.classList.remove("active");
                });
            }

            console.log("✅ Scroll restaurado correctamente");
            mostrarToast("Scroll restaurado", "success");
        } catch (e) {
            console.error("❌ Error al restaurar scroll:", e);
        }
    }

    function mostrarToast(mensaje, tipo = "success", duracion = 3000) {
        const notification = document.getElementById("notification");
        const icon = document.getElementById("notificationIcon");
        const messageEl = document.getElementById("notificationMessage");

        if (!notification) return;

        // Configurar icono según tipo
        const iconos = {
            success: "✓",
            error: "✕",
            warning: "⚠️",
            info: "ℹ️",
        };

        // Aplicar estilos según tipo
        notification.className = "notification show " + tipo;
        icon.textContent = iconos[tipo] || "✓";
        messageEl.textContent = mensaje;

        // Mostrar notificación
        setTimeout(() => {
            notification.classList.add("show");
        }, 100);

        // Ocultar después de la duración
        setTimeout(() => {
            notification.classList.remove("show");
        }, duracion);
    }

    let modalStack = []; // Stack de modales abiertos
    let focusBeforeModal = null; // Elemento con foco antes de abrir modal
    let modalClickListeners = {}; // Almacenar listeners de overlay por modal ID

    /**
     * Intenta cerrar un modal validando si hay cambios sin guardar
     * @param {string} modalId - ID del modal a cerrar
     * @returns {boolean} - true si se cerró, false si el usuario canceló
     */
    async function intentarCerrarModalConValidacion(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return false;

        // Obtener el formulario dentro del modal (si existe)
        const formulario = modal.querySelector("form");

        // Verificar si hay cambios sin guardar
        // 1. Variable global window.formularioTieneCambios (usado en Casos)
        // 2. Variable específica por modal (usado en Bugs, Ejecuciones, etc.)
        const tieneCambios =
            window.formularioTieneCambios ||
            (formulario &&
                formulario.hasAttribute("data-tiene-cambios") &&
                formulario.getAttribute("data-tiene-cambios") === "true");

        if (tieneCambios) {
            // Mostrar confirmación personalizada
            const confirmar = await mostrarConfirmacionApp({
                titulo: "Cambios sin guardar",
                mensaje:
                    "Tienes cambios sin guardar.<br><br>¿Deseas descartar los cambios y cerrar?",
                icono: "⚠️",
                textoOk: "Descartar cambios",
                textoCancelar: "Seguir editando",
            });

            if (!confirmar) {
                return false; // Usuario canceló, no cerrar modal
            }

            // Limpiar flag de cambios
            window.formularioTieneCambios = false;
            if (formulario) {
                formulario.removeAttribute("data-tiene-cambios");
            }
        }

        // Cerrar el modal
        cerrarModal(modalId);
        return true;
    }

    /**
     * Abre un modal con trap de foco y soporte para teclado
     * @param {string} modalId - ID del modal a abrir
     */
    function abrirModal(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;

        // Guardar el foco actual
        focusBeforeModal = document.activeElement;

        // Agregar al stack
        modalStack.push(modalId);

        // Mostrar modal
        modal.classList.add("active");
        document.body.style.overflow = "hidden";

        // Ajustar z-index dinámicamente según profundidad del stack
        try {
            const rootStyles = getComputedStyle(document.documentElement);
            const base =
                parseInt(rootStyles.getPropertyValue("--z-modal")) || 1000;
            const step = 20; // incremento por nivel
            const overlayZ = base + modalStack.length * step;
            const innerModal = modal.querySelector(".modal");
            modal.style.zIndex = overlayZ; // overlay
            if (innerModal) innerModal.style.zIndex = overlayZ + 5; // modal content slightly above overlay
        } catch (e) {
            // no-op
        }

        // Aplicar trap de foco
        aplicarTrapDeFoco(modal);

        // Focus en primer elemento focusable
        setTimeout(() => {
            const primerFocusable = obtenerElementosFocusables(modal)[0];
            if (primerFocusable) {
                primerFocusable.focus();
            }
        }, 100);

        // Listener para ESC
        modal.addEventListener("keydown", manejarEscapeModal);

        // Listener para click en overlay (cierre al hacer clic fuera del modal)
        const handleOverlayClick = (e) => {
            // Solo reaccionar si el click es en el overlay (no en el contenido del modal)
            if (e.target === modal) {
                e.stopPropagation();
                intentarCerrarModalConValidacion(modalId);
            }
        };

        // Guardar el listener para poder removerlo después
        modalClickListeners[modalId] = handleOverlayClick;
        modal.addEventListener("click", handleOverlayClick);
    }

    /**
     * Cierra un modal y restaura el foco
     * @param {string} modalId - ID del modal a cerrar
     */
    function cerrarModal(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;

        try {
            // Remover del stack
            const index = modalStack.indexOf(modalId);
            if (index > -1) {
                modalStack.splice(index, 1);
            }

            // Remover listener de click en overlay
            if (modalClickListeners[modalId]) {
                modal.removeEventListener(
                    "click",
                    modalClickListeners[modalId]
                );
                delete modalClickListeners[modalId];
            }

            // Ocultar modal
            modal.classList.remove("active");

            // Limpiar inline z-index del modal cerrado
            try {
                modal.style.zIndex = "";
                const innerModal = modal.querySelector(".modal");
                if (innerModal) innerModal.style.zIndex = "";
            } catch (e) {}

            // Remover trap de foco
            removerTrapDeFoco(modal);

            // Remover listener de ESC
            modal.removeEventListener("keydown", manejarEscapeModal);

            // Restaurar overflow solo si no hay más modales
            if (modalStack.length === 0) {
                document.body.style.overflow = "auto";

                // Restaurar foco
                if (focusBeforeModal && focusBeforeModal.focus) {
                    focusBeforeModal.focus();
                }
            } else {
                // Recalcular z-index para los modales aún abiertos según su posición en el stack
                try {
                    const rootStyles = getComputedStyle(
                        document.documentElement
                    );
                    const base =
                        parseInt(rootStyles.getPropertyValue("--z-modal")) ||
                        1000;
                    const step = 20;
                    for (let i = 0; i < modalStack.length; i++) {
                        const id = modalStack[i];
                        const m = document.getElementById(id);
                        if (!m) continue;
                        const z = base + (i + 1) * step;
                        m.style.zIndex = z;
                        const inner = m.querySelector(".modal");
                        if (inner) inner.style.zIndex = z + 5;
                    }
                } catch (e) {}
            }
        } catch (error) {
            // Si hay un error, asegurar que el overflow se restaure
            console.error("Error al cerrar modal:", error);
            if (modalStack.length === 0) {
                document.body.style.overflow = "auto";
            }
        }
    }

    /**
     * Obtiene todos los elementos focusables dentro de un contenedor
     * @param {HTMLElement} container - Contenedor
     * @returns {Array} - Array de elementos focusables
     */
    function obtenerElementosFocusables(container) {
        const selector =
            'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
        return Array.from(container.querySelectorAll(selector)).filter((el) => {
            return el.offsetParent !== null; // Solo elementos visibles
        });
    }

    /**
     * Aplica trap de foco a un modal
     * @param {HTMLElement} modal - Modal
     */
    function aplicarTrapDeFoco(modal) {
        modal.addEventListener("keydown", function (e) {
            if (e.key !== "Tab") return;

            const focusables = obtenerElementosFocusables(modal);
            if (focusables.length === 0) return;

            const primerFocusable = focusables[0];
            const ultimoFocusable = focusables[focusables.length - 1];

            // Shift + Tab en el primer elemento -> ir al último
            if (e.shiftKey && document.activeElement === primerFocusable) {
                e.preventDefault();
                ultimoFocusable.focus();
            }
            // Tab en el último elemento -> ir al primero
            else if (
                !e.shiftKey &&
                document.activeElement === ultimoFocusable
            ) {
                e.preventDefault();
                primerFocusable.focus();
            }
        });
    }

    /**
     * Remueve trap de foco de un modal
     * @param {HTMLElement} modal - Modal
     */
    function removerTrapDeFoco(modal) {
        // Los listeners se limpian automáticamente al cerrar
        // pero podríamos usar removeEventListener si guardáramos la referencia
    }

    /**
     * Maneja la tecla ESC para cerrar modales
     * @param {KeyboardEvent} e - Evento de teclado
     */
    function manejarEscapeModal(e) {
        if (e.key === "Escape") {
            // Cerrar el último modal del stack (con validación de cambios)
            if (modalStack.length > 0) {
                const ultimoModal = modalStack[modalStack.length - 1];
                intentarCerrarModalConValidacion(ultimoModal);
            }
        }
    }

    /**
     * Formatea una fecha al formato español (dd/mm/yyyy)
     * @param {string|Date} fecha - Fecha a formatear
     * @returns {string} - Fecha formateada o '-' si es inválida
     * @example formatearFecha('2025-01-15') // '15/1/2025'
     */
    function formatearFecha(fecha) {
        if (!fecha) return "-";
        const date = typeof fecha === "string" ? new Date(fecha) : fecha;
        return date.toLocaleDateString("es-ES");
    }

    /**
     * Escapa caracteres HTML para prevenir XSS
     * @param {string} text - Texto a sanitizar
     * @returns {string} - Texto seguro sin HTML
     */
    function escapeHtml(text) {
        if (!text) return "";

        const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
            "/": "&#x2F;",
        };

        return String(text).replace(/[&<>"'\/]/g, function (m) {
            return map[m];
        });
    }

    /**
     * Sanitiza HTML permitiendo solo tags seguros específicos
     * @param {string} html - HTML a sanitizar
     * @param {Array} allowedTags - Tags permitidos (por defecto: br, strong, em, p)
     * @returns {string} - HTML sanitizado
     */
    function sanitizeHtml(html, allowedTags) {
        if (!html) return "";

        allowedTags = allowedTags || ["br", "strong", "em", "p", "b", "i", "u"];

        // Primero escapar todo
        let safe = escapeHtml(html);

        // Luego permitir solo tags específicos
        allowedTags.forEach(function (tag) {
            const openRegex = new RegExp("&lt;" + tag + "&gt;", "gi");
            const closeRegex = new RegExp("&lt;\\/" + tag + "&gt;", "gi");
            safe = safe.replace(openRegex, "<" + tag + ">");
            safe = safe.replace(closeRegex, "</" + tag + ">");
        });

        return safe;
    }

    /**
     * Valida un campo de formulario en tiempo real
     * @param {HTMLElement} input - El elemento input/textarea a validar
     * @param {Object} options - Opciones de validación
     */
    function validarCampoEnTiempoReal(input, options) {
        if (!input) return;

        options = options || {};
        const minLength =
            options.minLength || input.getAttribute("minlength") || 0;
        const maxLength =
            options.maxLength || input.getAttribute("maxlength") || Infinity;
        const required =
            options.required !== undefined
                ? options.required
                : input.hasAttribute("required");
        const pattern = options.pattern || input.getAttribute("pattern");
        const customValidator = options.validator; // Función personalizada

        const value = input.value || "";
        const currentLength = value.length;

        // Encontrar o crear elementos de feedback
        let errorDiv = input.nextElementSibling;
        if (!errorDiv || !errorDiv.classList.contains("form-error")) {
            errorDiv = document.createElement("div");
            errorDiv.className = "form-error hidden";
            input.parentNode.insertBefore(errorDiv, input.nextSibling);
        }

        let counterSpan = input.parentNode.querySelector(".char-counter");

        // Array de errores
        const errors = [];

        // Validar requerido
        if (required && currentLength === 0) {
            errors.push("Este campo es obligatorio");
        }

        // Validar longitud mínima (solo si hay contenido)
        if (currentLength > 0 && currentLength < minLength) {
            errors.push(
                `Mínimo ${minLength} caracteres (tienes ${currentLength})`
            );
        }

        // Validar longitud máxima
        if (currentLength > maxLength) {
            errors.push(
                `Máximo ${maxLength} caracteres (tienes ${currentLength})`
            );
        }

        // Validar patrón
        if (pattern && currentLength > 0) {
            const regex = new RegExp(pattern);
            if (!regex.test(value)) {
                errors.push(options.patternMessage || "Formato inválido");
            }
        }

        // Validación personalizada
        if (customValidator && typeof customValidator === "function") {
            const customError = customValidator(value);
            if (customError) {
                errors.push(customError);
            }
        }

        // Mostrar/ocultar errores
        if (errors.length > 0) {
            errorDiv.textContent = errors[0]; // Mostrar primer error
            errorDiv.classList.remove("hidden");
            input.classList.add("error");
            input.setCustomValidity(errors[0]); // HTML5 validation API
        } else {
            errorDiv.classList.add("hidden");
            input.classList.remove("error");
            input.setCustomValidity(""); // Limpiar error HTML5
        }

        // Actualizar contador si existe
        if (counterSpan) {
            const currentSpan = counterSpan.querySelector(".current");
            if (currentSpan) {
                currentSpan.textContent = currentLength;

                // Color del contador
                if (currentLength >= minLength) {
                    currentSpan.classList.add("valid");
                } else {
                    currentSpan.classList.remove("valid");
                }
            }
        }

        return errors.length === 0;
    }

    /**
     * Configura validación en tiempo real para un formulario completo
     * @param {string|HTMLElement} formIdOrElement - ID del formulario o elemento
     * @param {Object} fieldsConfig - Configuración de cada campo
     */
    function configurarValidacionFormulario(formIdOrElement, fieldsConfig) {
        const form =
            typeof formIdOrElement === "string"
                ? document.getElementById(formIdOrElement)
                : formIdOrElement;

        if (!form) return;

        // Para cada campo configurado
        Object.keys(fieldsConfig).forEach(function (fieldId) {
            const input = document.getElementById(fieldId);
            if (!input) return;

            const config = fieldsConfig[fieldId];

            // Agregar evento input para validación en tiempo real
            input.addEventListener("input", function () {
                validarCampoEnTiempoReal(input, config);
            });

            // Agregar evento blur para validar al salir del campo
            input.addEventListener("blur", function () {
                validarCampoEnTiempoReal(input, config);
            });
        });

        // Prevenir submit si hay errores
        form.addEventListener("submit", function (e) {
            let hasErrors = false;

            Object.keys(fieldsConfig).forEach(function (fieldId) {
                const input = document.getElementById(fieldId);
                if (!input) return;

                const isValid = validarCampoEnTiempoReal(
                    input,
                    fieldsConfig[fieldId]
                );
                if (!isValid) {
                    hasErrors = true;
                }
            });

            if (hasErrors) {
                e.preventDefault();
                mostrarToast(
                    "Por favor corrige los errores antes de continuar",
                    "warning"
                );
            }
        });
    }

    /**
     * Detecta el tipo de error basado en el mensaje o error object
     * @param {Error|string} error - El error a clasificar
     * @returns {string} - Tipo de error
     */
    function detectarTipoError(error) {
        const errorMsg = (
            typeof error === "string" ? error : error.message || ""
        ).toLowerCase();

        if (
            errorMsg.includes("network") ||
            errorMsg.includes("conexión") ||
            errorMsg.includes("offline")
        ) {
            return ErrorTypes.NETWORK;
        }
        if (
            errorMsg.includes("permission") ||
            errorMsg.includes("permiso") ||
            errorMsg.includes("access denied")
        ) {
            return ErrorTypes.PERMISSION;
        }
        if (errorMsg.includes("timeout") || errorMsg.includes("timed out")) {
            return ErrorTypes.TIMEOUT;
        }
        if (
            errorMsg.includes("validation") ||
            errorMsg.includes("invalid") ||
            errorMsg.includes("inválido")
        ) {
            return ErrorTypes.VALIDATION;
        }
        if (errorMsg.includes("not found") || errorMsg.includes("404")) {
            return ErrorTypes.NOT_FOUND;
        }
        if (
            errorMsg.includes("server error") ||
            errorMsg.includes("500") ||
            errorMsg.includes("503")
        ) {
            return ErrorTypes.SERVER_ERROR;
        }

        return ErrorTypes.UNKNOWN;
    }

    /**
     * Muestra un error tipificado con UI mejorada
     * @param {Error|string} error - El error a mostrar
     * @param {string} tipoManual - Tipo de error manual (opcional)
     * @param {Object} opciones - Opciones adicionales
     */
    function mostrarErrorTipificado(error, tipoManual, opciones) {
        opciones = opciones || {};

        const tipo = tipoManual || detectarTipoError(error);
        const errorInfo =
            ErrorMessages[tipo] || ErrorMessages[ErrorTypes.UNKNOWN];

        // Si solo queremos un toast simple
        if (opciones.simple) {
            mostrarToast(errorInfo.message, "error");
            return;
        }

        // Modal de error completo
        const errorModal = document.createElement("div");
        errorModal.className = "modal-overlay active";
        errorModal.style.zIndex = "var(--z-confirmation)";
        errorModal.id = "errorModal";

        const detalles =
            typeof error === "object" && error.message ? error.message : error;

        errorModal.innerHTML = `
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header" style="background: ${
          errorInfo.color
      }; color: white;">
        <h3 class="modal-title" style="color: white;">
          <span style="font-size: 1.5rem; margin-right: 0.5rem;">${
              errorInfo.icon
          }</span>
          ${errorInfo.title}
        </h3>
        <button class="modal-close" style="color: white;" onclick="cerrarErrorModal()">✕</button>
      </div>

      <div class="modal-body">
        <p style="font-size: 1rem; line-height: 1.6; margin-bottom: 1rem;">
          ${errorInfo.message}
        </p>

        ${
            detalles
                ? `
          <details style="background: #f8fafc; padding: 0.75rem; border-radius: 6px; margin-top: 1rem;">
            <summary style="cursor: pointer; font-weight: 600; color: var(--text-secondary);">
              Detalles técnicos
            </summary>
            <pre style="margin-top: 0.75rem; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; color: var(--text-tertiary);">${escapeHtml(
                detalles
            )}</pre>
          </details>
        `
                : ""
        }
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="cerrarErrorModal(); ${
            opciones.onAction || ""
        }">
          ${errorInfo.action}
        </button>
      </div>
    </div>
  `;

        document.body.appendChild(errorModal);
    }

    /**
     * Cierra el modal de error
     */
    function cerrarErrorModal() {
        const errorModal = document.getElementById("errorModal");
        if (errorModal) {
            errorModal.remove();
        }
    }

    // ───────────────────────────────────────────────────────────────────────────
    // FUNCIONES DE DEPURACIÓN
    // ───────────────────────────────────────────────────────────────────────────

    // Debug helper: se activa poniendo `window.QA_DEBUG = true` en la consola
    window.QA_DEBUG = window.QA_DEBUG || false;
    function debugLog(mensaje, datos) {
        try {
            if (!window.QA_DEBUG) return;
            if (console && typeof console.debug === "function") {
                console.debug("[QA DEBUG] " + mensaje, datos || "");
            } else if (console && typeof console.log === "function") {
                console.log("[QA DEBUG] " + mensaje, datos || "");
            }
        } catch (e) {
            /* ignore */
        }
    }

    // Verificar que las funciones críticas estén disponibles
    window.addEventListener("DOMContentLoaded", function () {
        debugLog("DOM cargado completamente");

        // Verificar funciones críticas
        const funcionesCriticas = [
            "mostrarSpinner",
            "ocultarSpinner",
            "mostrarToast",
            "abrirModal",
            "cerrarModal",
        ];

        funcionesCriticas.forEach((func) => {
            if (typeof window[func] === "function") {
                debugLog(`✅ Función ${func} disponible`);
            } else {
                console.error(`❌ Función ${func} NO disponible`);
            }
        });

        // Restaurar última pantalla vista (si existe)
        setTimeout(function () {
            try {
                var last = null;
                try {
                    last = localStorage.getItem("qaLastScreen");
                } catch (e) {
                    last = null;
                }

                if (!last) return;

                debugLog("Restaurando última pantalla:", last);

                // Si la última pantalla fue bugs, mostrar casos en su lugar
                if (last === "bugs") {
                    debugLog("Redirigiendo de bugs a casos");
                    last = "casos";
                }

                if (last === "casos") {
                    var url = null;
                    try {
                        url = recuperarSheetUrl();
                    } catch (e) {
                        url = null;
                    }
                    if (url && typeof mostrarPantallaCasos === "function") {
                        mostrarPantallaCasos(url);
                    }
                } else if (last === "setup") {
                    var url = null;
                    try {
                        url = recuperarSheetUrl();
                    } catch (e) {
                        url = null;
                    }
                    if (typeof mostrarPantallaSetup === "function")
                        mostrarPantallaSetup(url || "", {});
                } else if (last === "metricasProyecto") {
                    if (typeof mostrarMetricasProyecto === "function")
                        mostrarMetricasProyecto();
                } else if (last === "metricasQA") {
                    if (typeof mostrarMetricasQA === "function")
                        mostrarMetricasQA();
                }
            } catch (e) {
                console.warn("No se pudo restaurar última pantalla:", e);
            }
        }, 250);
    });

    // ───────────────────────────────────────────────────────────────────────────
    // FUNCIONES DE MENÚ DE USUARIO
    // ───────────────────────────────────────────────────────────────────────────

    function toggleUserMenu() {
        const menu = document.getElementById("userMenu");
        if (menu) {
            menu.classList.toggle("hidden");
        }
    }

    function cerrarSesion() {
        if (
            confirm(
                "¿Estás seguro de que deseas cerrar sesión de la aplicación?"
            )
        ) {
            // Limpiar localStorage para resetear el estado de la app
            localStorage.clear();

            // Recargar la aplicación sin cerrar sesión de Google
            // No usar spinner para evitar que se quede infinito
            window.top.location.reload();
        }
    }

    function cambiarCuenta() {
        // Limpiar localStorage
        localStorage.clear();

        // Redirigir a la página de selección de cuenta de Google
        // Esto fuerza al usuario a elegir una cuenta diferente
        window.top.location.href = "https://accounts.google.com/AccountChooser";
    }

    // Cerrar menú al hacer clic fuera
    document.addEventListener("click", function (event) {
        const userMenu = document.getElementById("userMenu");
        const userAvatar = document.getElementById("userAvatar");

        if (
            userMenu &&
            !userMenu.classList.contains("hidden") &&
            !userMenu.contains(event.target) &&
            !userAvatar.contains(event.target)
        ) {
            userMenu.classList.add("hidden");
        }
    });

    // ───────────────────────────────────────────────────────────────────────────
    // INICIALIZACIÓN SEGURA
    // ───────────────────────────────────────────────────────────────────────────

    // Asegurar que las funciones estén disponibles globalmente
    window.mostrarSpinner = mostrarSpinner;
    window.ocultarSpinner = ocultarSpinner;
    window.restaurarScroll = restaurarScroll;
    window.mostrarToast = mostrarToast;
    window.abrirModal = abrirModal;
    window.cerrarModal = cerrarModal;
    window.getBadgePrioridad = getBadgePrioridad;
    window.getBadgeEstado = getBadgeEstado;
    window.formatearFecha = formatearFecha;
    window.escapeHtml = escapeHtml;
    window.sanitizeHtml = sanitizeHtml;
    window.validarCampoEnTiempoReal = validarCampoEnTiempoReal;
    window.configurarValidacionFormulario = configurarValidacionFormulario;
    window.ErrorTypes = ErrorTypes;
    window.mostrarErrorTipificado = mostrarErrorTipificado;
    window.detectarTipoError = detectarTipoError;
    window.cerrarErrorModal = cerrarErrorModal;
    window.intentarCerrarModalConValidacion = intentarCerrarModalConValidacion;
    window.toggleUserMenu = toggleUserMenu;
    window.cerrarSesion = cerrarSesion;
    window.cambiarCuenta = cambiarCuenta;

    // Atajo de teclado de emergencia para restaurar scroll (Ctrl+Alt+R)
    document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && e.altKey && e.key === "r") {
            e.preventDefault();
            restaurarScroll();
        }
    });

    // Frontend Scripts Main cargado
</script>
